name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "DesignAssets/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "DesignAssets/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-verify-build:
    name: Test (iOS 27.2) & Verify Release Build
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Xcode 27.2 & Cache
        id: xcode
        uses: ./.github/actions/setup-xcode
        with:
          cache-prefix: dysprosium-ci

      - name: Run DysprosiumTests
        id: tests
        uses: ./.github/actions/run-tests

      - name: Verify Release arm64 IPA (iOS 27.2 SDK)
        id: pkg
        uses: ./.github/actions/package-ipa

      - name: Write CI Summary
        if: always() && steps.pkg.outcome == 'success'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_NUM: ${{ steps.pkg.outputs.build-number }}
          IPA_NAME: ${{ steps.pkg.outputs.ipa-name }}
          IPA_SIZE: ${{ steps.pkg.outputs.ipa-size }}
          IPA_SHA256: ${{ steps.pkg.outputs.ipa-sha256 }}
          SDK_VERSION: ${{ steps.pkg.outputs.sdk-version }}
          SIM_NAME: ${{ steps.tests.outputs.simulator-name }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## CI Verified · Dysprosium v${VERSION} (build ${BUILD_NUM})

          | Metric | Value |
          | --- | --- |
          | **Tests** | Passed on \`${SIM_NAME}\` |
          | **IPA** | \`${IPA_NAME}\` (${IPA_SIZE}) |
          | **SHA-256** | \`${IPA_SHA256}\` |
          | **SDK** | \`iphoneos${SDK_VERSION}\` (\`arm64\`) |
          | **Toolchain** | Xcode \`${XCODE_VERSION}\` (\`${XCODE_BUILD}\`) |
          EOF
