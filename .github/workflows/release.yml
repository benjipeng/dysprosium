name: Release LiveContainer IPA

run-name: "Release · ${{ github.ref_name }} · #${{ github.run_number }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update a GitHub Release with the built IPA"
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false
      run_tests:
        description: "Run DysprosiumTests on iOS 27.2 Simulator before packaging"
        type: boolean
        default: true
      release_tag:
        description: "Optional GitHub Release tag override (must match v<MARKETING_VERSION> or v<MARKETING_VERSION>-*)"
        type: string
        default: ""
      release_notes:
        description: "Optional extra notes prepended to the GitHub Release description"
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-release:
    name: Test, Build & Publish IPA (Xcode 27.2)
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fail-fast Version & Tag Parity Check
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_tag=""
          if [ "$EVENT_NAME" = "push" ]; then
            expected_tag="$REF_NAME"
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            expected_tag="$INPUT_RELEASE_TAG"
          fi
          bash scripts/version_metadata.sh \
            --file Version.xcconfig \
            --verify-tag "$expected_tag" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Xcode 27.2 & Cache
        id: xcode
        uses: ./.github/actions/setup-xcode
        with:
          cache-prefix: dysprosium-release

      - name: Run DysprosiumTests Gate
        if: github.event_name == 'push' || inputs.run_tests == true
        uses: ./.github/actions/run-tests

      - name: Package & Verify LiveContainer IPA
        id: pkg
        uses: ./.github/actions/package-ipa
        with:
          expected-tag: ${{ steps.meta.outputs.release_tag }}

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Dysprosium-v${{ steps.pkg.outputs.version }}_b${{ steps.pkg.outputs.build-number }}-arm64
          path: |
            build/Dysprosium-v*.ipa
            build/Dysprosium-v*.ipa.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release == true
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_NUM: ${{ steps.pkg.outputs.build-number }}
          IPA_PATH: ${{ steps.pkg.outputs.ipa-path }}
          SHA_PATH: ${{ steps.pkg.outputs.sha256-path }}
          IPA_NAME: ${{ steps.pkg.outputs.ipa-name }}
          IPA_SHA256: ${{ steps.pkg.outputs.ipa-sha256 }}
          IPA_SIZE: ${{ steps.pkg.outputs.ipa-size }}
          SDK_VERSION: ${{ steps.pkg.outputs.sdk-version }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EXTRA_NOTES: ${{ inputs.release_notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: bash scripts/publish_github_release.sh

      - name: Write Release Summary
        if: always() && steps.pkg.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
          BUILD_NUM: ${{ steps.pkg.outputs.build-number }}
          IPA_NAME: ${{ steps.pkg.outputs.ipa-name }}
          IPA_SIZE: ${{ steps.pkg.outputs.ipa-size }}
          IPA_SHA256: ${{ steps.pkg.outputs.ipa-sha256 }}
          SDK_VERSION: ${{ steps.pkg.outputs.sdk-version }}
          XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          XCODE_BUILD: ${{ steps.xcode.outputs.build }}
          PUBLISHED: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release · Dysprosium v${VERSION} (build ${BUILD_NUM})

          | Metric | Value |
          | --- | --- |
          | **Tag** | \`${RELEASE_TAG}\` |
          | **IPA** | \`${IPA_NAME}\` (${IPA_SIZE}) |
          | **SHA-256** | \`${IPA_SHA256}\` |
          | **SDK** | \`iphoneos${SDK_VERSION}\` (\`arm64\`) |
          | **Toolchain** | Xcode \`${XCODE_VERSION}\` (\`${XCODE_BUILD}\`) |
          | **Release published** | \`${PUBLISHED}\` |
          EOF
