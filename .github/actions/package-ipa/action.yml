name: Build & Verify LiveContainer Release IPA
description: Reads Version.xcconfig, optionally verifies tag parity, archives the unsigned arm64 iOS 27.2 IPA, and generates its SHA-256 digest.

inputs:
  version-config:
    description: Path to Version.xcconfig
    required: false
    default: "Version.xcconfig"
  derived-data-path:
    description: Workspace-relative DerivedData directory
    required: false
    default: "DerivedData"
  expected-tag:
    description: Optional release tag (e.g. v0.1.9) that must match DYSPROSIUM_MARKETING_VERSION
    required: false
    default: ""

outputs:
  version:
    description: Marketing version from Version.xcconfig
    value: ${{ steps.meta.outputs.version }}
  build-number:
    description: Build number from Version.xcconfig
    value: ${{ steps.meta.outputs.build_number }}
  ipa-name:
    description: Versioned IPA filename
    value: ${{ steps.build.outputs.ipa_name }}
  ipa-path:
    description: Workspace-relative path to the versioned IPA
    value: ${{ steps.build.outputs.ipa_path }}
  sha256-path:
    description: Workspace-relative path to the SHA-256 checksum file
    value: ${{ steps.build.outputs.sha256_path }}
  ipa-sha256:
    description: Hex-encoded SHA-256 digest of the versioned IPA
    value: ${{ steps.build.outputs.ipa_sha256 }}
  ipa-size:
    description: Human-readable size of the versioned IPA
    value: ${{ steps.build.outputs.ipa_size }}
  sdk-version:
    description: Verified LC_BUILD_VERSION iOS SDK version from vtool
    value: ${{ steps.build.outputs.sdk_version }}

runs:
  using: composite
  steps:
    - name: Read & validate Version.xcconfig
      id: meta
      shell: bash
      env:
        VERSION_CONFIG: ${{ inputs.version-config }}
        EXPECTED_TAG: ${{ inputs.expected-tag }}
      run: |
        set -euo pipefail
        bash scripts/version_metadata.sh \
          --file "$VERSION_CONFIG" \
          --verify-tag "$EXPECTED_TAG" \
          --github-output "$GITHUB_OUTPUT"

    - name: Archive unsigned arm64 IPA & compute SHA-256
      id: build
      shell: bash
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        BUILD_NUM: ${{ steps.meta.outputs.build_number }}
        DERIVED_DATA_REL: ${{ inputs.derived-data-path }}
      run: |
        set -euo pipefail
        DERIVED_DATA_PATH="${PWD}/${DERIVED_DATA_REL}" ./scripts/build_livecontainer_ipa.sh

        IPA_NAME="Dysprosium-v${VERSION}_b${BUILD_NUM}.ipa"
        IPA_PATH="build/${IPA_NAME}"
        SHA_PATH="${IPA_PATH}.sha256"

        if [ ! -f "$IPA_PATH" ]; then
          echo "Error: Expected IPA not found at '${IPA_PATH}'" >&2
          ls -la build/
          exit 1
        fi

        (
          cd build
          shasum -a 256 "$IPA_NAME" > "${IPA_NAME}.sha256"
        )

        IPA_SHA256="$(awk '{print $1}' "$SHA_PATH")"
        IPA_SIZE="$(du -h "$IPA_PATH" | awk '{print $1}')"
        SDK_VERSION="$(vtool -show-build build/Dysprosium.xcarchive/Products/Applications/Dysprosium.app/Dysprosium | awk '/^[[:space:]]*sdk / {print $2; exit}')"

        ls -lh "$IPA_PATH" "$SHA_PATH"

        {
          echo "ipa_name=${IPA_NAME}"
          echo "ipa_path=${IPA_PATH}"
          echo "sha256_path=${SHA_PATH}"
          echo "ipa_sha256=${IPA_SHA256}"
          echo "ipa_size=${IPA_SIZE}"
          echo "sdk_version=${SDK_VERSION}"
        } >> "$GITHUB_OUTPUT"
